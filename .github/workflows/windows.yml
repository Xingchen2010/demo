name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Windows Distribution
        run: |
          # 1. 获取当前目录绝对路径
          PROJECT_PATH=$(pwd)
          # 2. 创建一个确定的输出目录
          mkdir -p $PROJECT_PATH/output
          
          # 3. 进入 SDK 目录执行
          cd renpy-8.2.1-sdk
          
          # 4. 关键：使用 --destination 参数强制指定输出位置到根目录的 output 文件夹
          ./renpy.sh launcher distribute "$PROJECT_PATH" --package windows --destination "$PROJECT_PATH/output"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 直接去我们指定的 output 文件夹里抓取所有的 zip 文件
          path: output/*.zip
          if-no-files-found: error
