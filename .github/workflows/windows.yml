name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Windows Distribution
        run: |
          # 1. 记录绝对路径
          PROJECT_PATH=$(pwd)
          
          # 2. 进入 SDK 目录，这是确保命令能识别的关键
          cd renpy-8.2.1-sdk
          
          # 3. 极简执行：[脚本] [模块] [项目路径] [命令] [目标平台]
          # 删掉了会导致报错的 --update 和 --destination
          ./renpy.sh launcher distribute "$PROJECT_PATH" --package windows

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 重点：RenPy 默认会把包生成在 SDK 目录下的 dist 文件夹里
          # 我们直接去那里抓取
          path: renpy-8.2.1-sdk/dist/*.zip
          if-no-files-found: error
