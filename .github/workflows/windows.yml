name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh
      - name: Build Windows Distribution
        run: |
          # 获取当前游戏源码的绝对路径
          PROJECT_PATH=$(pwd)
          
          # 进入 SDK 目录，直接调用 launcher 来执行 distribute 命令
          cd renpy-8.2.1-sdk
          ./renpy.sh launcher distribute "$PROJECT_PATH" --package windows
      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 这样写能确保抓到生成的压缩包
          path: "renpy-8.2.1-sdk/*.zip"
