name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Force Inject Build Config
        run: |
          # 强制创建一个包含打包定义的 options.rpy 文件
          # 确保 RenPy 知道它该干活了
          mkdir -p game
          cat > game/distribute_options.rpy <<EOF
          init python:
              build.directory_name = "Aozora-Build"
              build.executable_name = "Aozora"
              build.archive("scripts", "all")
              build.classify("game/**.rpy", "scripts")
              build.classify("game/**.rpyc", "scripts")
              build.package("windows", "zip", "windows", description="Windows Version")
          EOF

      - name: Build Windows Distribution
        run: |
          PROJECT_PATH=$(pwd)
          cd renpy-8.2.1-sdk
          # 运行分发命令
          ./renpy.sh launcher distribute "$PROJECT_PATH"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 提高抓取范围：抓取所有 zip 及其所在的文件夹
          path: |
            renpy-8.2.1-sdk/dist/*.zip
            **/*.zip
          if-no-files-found: error
