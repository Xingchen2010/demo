name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Windows Distribution
        run: |
          PROJECT_PATH=$(pwd)
          cd renpy-8.2.1-sdk
          # 核心修正：不再只传 windows，而是运行默认的全平台分发指令
          # 这能解决 "No packages are selected" 的问题
          ./renpy.sh launcher distribute "$PROJECT_PATH"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 扫描所有生成的 zip 压缩包，不管它叫什么
          path: "**/*.zip"
          if-no-files-found: error
        with:
          name: Aozora-Windows-Version
          # 重点：RenPy 默认会把包生成在 SDK 目录下的 dist 文件夹里
          # 我们直接去那里抓取
          path: renpy-8.2.1-sdk/dist/*.zip
          if-no-files-found: error
