name: Build Windows Version
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Windows Distribution
        run: |
          PROJECT_PATH=$(pwd)
          # 创建输出目录
          mkdir -p $PROJECT_PATH/output
          
          cd renpy-8.2.1-sdk
          # 核心修正：添加 --update 确保项目被正确识别，并使用绝对路径 destination
          ./renpy.sh launcher distribute "$PROJECT_PATH" --package windows --update --destination "$PROJECT_PATH/output"

      - name: Upload Windows Build
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Windows-Version
          # 使用通配符递归搜索，确保万无一失
          path: "output/**/*.zip"
          if-no-files-found: error
