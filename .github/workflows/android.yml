name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2

      - name: Build Android APK
        run: |
          # 1. 记录路径
          ROOT_DIR=$(pwd)
          SDK_DIR=$ROOT_DIR/renpy-8.2.1-sdk
          
          # 2. 核心：设置 PythonPath 确保能找到 RenPy 模块
          export PYTHONPATH=$SDK_DIR:$SDK_DIR/renpy
          
          # 3. 强制触发安卓环境安装
          # 我们不再通过 renpy.sh 调用，而是直接用 python 运行 launcher 模块
          python3 $SDK_DIR/renpy.py $SDK_DIR/launcher android_configure "$ROOT_DIR" --yes

          # 4. 执行正式打包
          python3 $SDK_DIR/renpy.py $SDK_DIR/launcher android_build "$ROOT_DIR" --assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          path: "**/*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          # 扫描所有生成的 apk 文件并打包上传
          path: "**/*.apk"
