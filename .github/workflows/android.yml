name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Android APK
        run: |
          # 1. 定义绝对路径，防止 RenPy 找不到家
          export RENPY_PATH=$(pwd)/renpy-8.2.1-sdk
          export GAME_PATH=$(pwd)
          
          # 2. 关键：进入 SDK 目录执行，并显式指向 launcher 文件夹
          # 这是解决 "unknown command" 的终极手段
          cd $RENPY_PATH
          ./renpy.sh launcher android_configure "$GAME_PATH" --yes
          ./renpy.sh launcher android_build "$GAME_PATH" --assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          path: "**/*.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          path: "**/*.apk"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          # 扫描所有生成的 apk 文件并打包上传
          path: "**/*.apk"
