name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 使用这个更稳定的 Action，它会自动下载并配置 Ren'Py 环境
      - name: Ren'Py Build
        uses: mal some/renpy-build-action@v1
        with:
          sdk-version: '8.2.1'
          project-path: '.'
          # 指定只构建安卓
          build-android: true

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-APK
          # Ren'Py 默认构建输出在项目根目录的 -dists 结尾的文件夹里
          path: '*-dists/*.apk'
