name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Android APK
        uses: Ayowel/renpy-setup-action@v2
        with:
          # 必填项：操作行为
          action: 'android_build'
          # 对应日志里的 'version' 参数，代替之前的 sdk-version
          version: '8.2.1'
          # 对应日志里的 'game' 参数，代替之前的 project-path
          game: '.'
          # 对应日志里的 'out_dir' 参数，代替之前的 output-dir
          out_dir: 'dist'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-apk
          path: 'dist/*.apk'
