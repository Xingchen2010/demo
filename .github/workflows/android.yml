name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Android APK
        run: |
          PROJECT_PATH=$(pwd)
          cd renpy-8.2.1-sdk
          # 使用最基础的指令，不加任何多余参数
          ./renpy.sh launcher android_build "$PROJECT_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          # 这样写可以确保不管 APK 藏在哪个文件夹都能被抓到
          path: "**/*.apk"
