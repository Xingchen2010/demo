name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install RenPy SDK
        run: |
          # 下载 SDK
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          echo "$(pwd)/renpy-8.2.1-sdk" >> $GITHUB_PATH

      - name: Build Android APK
        run: |
          # 运行编译命令，使用你在根目录准备好的 .android.json
          ./renpy-8.2.1-sdk/renpy.sh . android_build --bundle
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          path: "**/*.apk"
