name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download RenPy
        run: |
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          # 赋予执行权限
          chmod +x ./renpy-8.2.1-sdk/renpy.sh

      - name: Build Android
        run: |
          # 核心修正：使用 launcher 接口并明确指向当前目录 (.)
          # 同时使用 assemble 命令生成正式的 apk
          ./renpy-8.2.1-sdk/renpy.sh launcher android_build . --assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Game-APK
          # 这里的路径改成通配符，确保能抓到生成的包
          path: "**/bin/*.apk"
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          # 使用通配符匹配所有生成的 apk 文件
          path: "**/*.apk"
