name: Mobile Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install RenPy SDK
        run: |
          # 下载 8.2.1 版本 SDK
          wget -q https://www.renpy.org/dl/8.2.1/renpy-8.2.1-sdk.tar.bz2
          tar -xf renpy-8.2.1-sdk.tar.bz2
          chmod +x renpy-8.2.1-sdk/renpy.sh

      - name: Build Android APK
        run: |
          PROJECT_PATH=$(pwd)
          cd renpy-8.2.1-sdk
          
          # 1. 强制安装 Android RAPT 环境（解决 NoneType 报错的关键）
          # --yes 会自动同意所有协议并下载数百MB的 Android SDK 和 NDK
          ./renpy.sh launcher android_configure "$PROJECT_PATH" --yes

          # 2. 执行正式编译
          # 生成 APK 文件
          ./renpy.sh launcher android_build "$PROJECT_PATH" --assemble

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Aozora-Android-Package
          # 扫描所有生成的 apk 文件并打包上传
          path: "**/*.apk"
